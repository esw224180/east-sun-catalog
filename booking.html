<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><title>東太陽｜預約品飲</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eaf0f7;color:#263b50;font:17px/1.7 'Microsoft JhengHei',sans-serif;padding:24px 16px}main{max-width:560px;margin:auto;padding:28px;background:#fffdf9;border-radius:18px;box-shadow:0 10px 40px #354b6212}h1{font-size:29px;margin:8px 0}small,p{color:#607184}label{display:block;font-weight:bold;margin-top:18px}input,select,textarea,button{font:inherit;width:100%;border:1px solid #aebdcd;border-radius:8px;padding:12px;background:white;color:#263b50}textarea{min-height:90px}button{background:#526e90;color:white;border:0;font-weight:bold;margin-top:24px;cursor:pointer}.preview{background:#edf2f8;padding:10px 14px;border-radius:7px;font-size:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}#summary{white-space:pre-wrap;background:#edf2f8;padding:18px;border-radius:8px}#error{color:#a33125}.consent{font-weight:normal;font-size:14px;display:flex;gap:9px}.consent input{width:20px;flex:none}.warning{text-align:center;font-size:13px;margin-top:24px}[hidden]{display:none!important}@media(max-width:420px){main{padding:20px}.row{grid-template-columns:1fr;gap:0}}</style>
<main><div id="connection" class="preview">正在連接 LINE…</div><small>東太陽製酒 EAST SUN DISTILLERY</small><h1>預約品飲</h1><p>一次填好資料，交由酒廠確認安排。</p>
<form id="booking"><label for="date">預約日期</label><input id="date" inputmode="numeric" placeholder="例如 20261022" pattern="[0-9]{8}" maxlength="8" required><small>請填西元年月日，共 8 碼。</small><label for="time">預約時間</label><input id="time" inputmode="numeric" placeholder="例如 1000 或 1430" pattern="[0-9]{4}" maxlength="4" required><small>24 小時制，共 4 碼；可填 10:00～17:00。</small><div class="row"><div><label for="name">姓名</label><input id="name" autocomplete="name" maxlength="50" required></div><div><label for="phone">手機號碼</label><input id="phone" type="tel" autocomplete="tel-national" placeholder="09 開頭，共 10 碼" pattern="09[0-9]{8}" maxlength="10" required></div></div><label for="people">人數</label><select id="people" required><option value="">請選擇</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select><label for="note">備註（選填）</label><textarea id="note" maxlength="500"></textarea><label class="consent"><input id="consent" type="checkbox" required><span>參與品飲者均已滿 18 歲，同意提供以上資料供東太陽預約聯繫使用。</span></label><div id="error" role="alert"></div><button id="submit" disabled>檢查送出</button></form>
<section id="result" hidden><h2>預約申請摘要</h2><div id="summary"></div><p id="sent">正在傳送，請勿重複送出…</p><button id="back" hidden>返回修改</button><button id="close" hidden>回到 LINE 查看預約資訊</button></section><p class="warning">禁止酒駕・飲酒過量，有害健康<br>未滿十八歲禁止飲酒</p></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
const BOOKING_LIFF_ID="2012112469-7XHgLsdu";let ready=false,sending=false;const requestId=crypto.randomUUID();
async function connect(){try{if(!BOOKING_LIFF_ID)throw Error("表單入口準備中，請稍後再試。");if(!liff.isInClient())throw Error("請在手機從東太陽官方 LINE 的「預約品飲」選單開啟。");await liff.init({liffId:BOOKING_LIFF_ID});if(!liff.isInClient())throw Error("請從東太陽官方 LINE 聊天室的「預約品飲」選單開啟表單。");const ctx=liff.getContext();if(!ctx||ctx.type!=="utou")throw Error("請從東太陽官方 LINE 一對一聊天室開啟，避免將預約傳到其他聊天室。");if(!liff.isLoggedIn())throw Error("請重新從官方 LINE 開啟並完成授權。");if(liff.permission.query){const permission=await liff.permission.query("chat_message.write");if(permission.state!=="granted")throw Error("請重新開啟表單並允許將預約資料傳送到 LINE 聊天室。");}ready=true;el("connection").textContent="請填好資料後按「檢查送出」，預約摘要會回傳到 LINE。";el("submit").disabled=false;}catch(e){el("connection").textContent=(e.message==="Failed to fetch"?"LINE 連接暫時失敗，請回聊天室重新開啟表單。":e.message)||"LINE 連接失敗，請重新開啟。";}}

const el=id=>document.getElementById(id);
function validateDateTime(rawDate,rawTime,now=new Date()){
 if(!/^\d{8}$/.test(rawDate))return '日期請填完整 8 碼，例如 20261022。';
 const y=+rawDate.slice(0,4),m=+rawDate.slice(4,6),d=+rawDate.slice(6),dt=new Date(Date.UTC(y,m-1,d));
 if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d)return '這個日期不存在，請重新填寫。';
 const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(now).replaceAll('-','');
 if(rawDate<today)return '預約日期不能早於今天。';
 if(!/^\d{4}$/.test(rawTime)||+rawTime.slice(2)>59||+rawTime<1000||+rawTime>1700)return '時間請填 1000～1700，例如 1430。';
 const selected=new Date(`${rawDate.slice(0,4)}-${rawDate.slice(4,6)}-${rawDate.slice(6)}T${rawTime.slice(0,2)}:${rawTime.slice(2)}:00+08:00`);
 if(selected<=now)return '預約時間已過，請選擇未來時間。';return '';
}
el('booking').addEventListener('submit',async e=>{e.preventDefault();if(!ready||sending)return;const date=el('date').value.trim(),time=el('time').value.trim(),name=el('name').value.trim(),phone=el('phone').value.trim(),people=el('people').value,note=el('note').value.trim();const error=validateDateTime(date,time)||(!/^[\u4e00-\u9fa5A-Za-z\s.\-]{2,50}$/.test(name)||/[\r\n]/.test(name)?'請填2～50字中文或英文姓名。':'');el('error').textContent=error;if(error)return;const text='品飲預約申請\n日期：'+date+'\n時間：'+time+'\n姓名：'+name+'\n電話：'+phone+'\n人數：'+people+'\n備註：'+(note||'無')+'\n申請碼：'+requestId;sending=true;el('submit').disabled=true;try{await liff.sendMessages([{type:'text',text}]);el('summary').textContent='日期：'+date+'\n時間：'+time+'\n姓名：'+name+'\n電話：'+phone+'\n人數：'+people+'\n備註：'+(note||'無');el('booking').hidden=true;el('result').hidden=false;el('sent').textContent='資料已傳送至 LINE，請查看機器人回覆的預約編號。收到預約編號才表示申請已受理；仍須店家確認。';el('close').hidden=false;liff.closeWindow();}catch(err){el('error').textContent='未能確認傳送結果。請先回聊天室查看是否已有預約編號；若沒有，可用本頁重試，請勿重新開啟多份表單。';sending=false;el('submit').disabled=false;}});el('close').onclick=()=>liff.closeWindow();connect();
</script></html>
