<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>東太陽｜品飲預約資料</title><style>*{box-sizing:border-box}body{font-family:"Microsoft JhengHei",sans-serif;margin:0;background:#edf3fa;color:#243347;padding:28px 18px 75px}main{max-width:520px;margin:auto;background:#fffdf9;padding:28px;border-radius:16px;box-shadow:0 12px 35px #24334712}h1{font-size:27px;line-height:1.4;margin:12px 0 20px}.step{color:#526c8d;font-size:14px;font-weight:700}.summary{background:#edf3fa;padding:17px;line-height:1.9;border-radius:8px}label{display:block;font-weight:700;margin:22px 0 8px}input,textarea,select{font:inherit;font-size:18px;width:100%;padding:13px;border:1px solid #aab6c4;border-radius:7px;background:#fff;color:#243347}textarea{resize:vertical;min-height:110px}small,.note{font-size:14px;line-height:1.8;color:#566272}button,.button{font:inherit;font-size:18px;font-weight:700;width:100%;border:0;border-radius:8px;background:#526c8d;color:white;padding:15px;margin-top:24px;cursor:pointer;text-decoration:none;display:block;text-align:center}button:disabled{opacity:.55;cursor:not-allowed}.error{padding:14px;background:#fff0ed;color:#8b2519;border-radius:6px;line-height:1.8}.privacy{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.8;font-weight:400}.privacy input{width:20px;height:20px;flex:none;margin-top:4px}.warning{text-align:center;font-size:14px;line-height:1.8;margin-top:24px;color:#4e5864}#review{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf3fa;padding:18px;line-height:1.9;border-radius:8px}input:focus,textarea:focus,select:focus{outline:3px solid #c6d9ed;outline-offset:2px}[hidden]{display:none!important}</style></head><body><main><div class="step">東太陽製酒 · 步驟 3 / 3</div><h1>一次填寫<br>品飲預約資料</h1><div id="error" class="error" role="alert" hidden></div><div class="summary" id="summary">正在讀取已選擇的日期與時間…</div><form id="details" hidden><label for="name">姓名</label><input id="name" name="name" autocomplete="name" minlength="2" maxlength="50" required placeholder="請填寫中文或英文姓名"><label for="phone">手機號碼</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" pattern="09[0-9]{8}" maxlength="10" required placeholder="09 開頭，共 10 碼"><label for="people">人數</label><select id="people" name="people" required><option value="">請選擇人數</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select><label for="note">備註（選填）</label><textarea id="note" name="note" maxlength="500" placeholder="例如：同行者需求或其他想讓我們知道的事項"></textarea><small>最多 500 字；沒有備註可留白。</small><label class="privacy"><input type="checkbox" id="consent" required><span>我確認參與品飲者均已滿 18 歲，並同意將姓名、電話、人數及備註傳送給東太陽官方 LINE，用於預約聯繫與安排。</span></label><button type="submit">檢查資料</button></form><section id="confirm" hidden><h2>請核對資料</h2><div id="review"></div><p class="note">下一步會開啟東太陽官方 LINE，將資料放進訊息輸入欄。請親自按「傳送」，再依 LINE 的確認畫面點選「確認送出」。</p><a id="returnLine" class="button">帶回 LINE 傳送</a><button id="edit" type="button">返回修改</button></section><p class="note">送出為預約申請，仍須店家確認。不提供線上酒類交易或付款。此頁不會儲存表單資料到瀏覽器；請勿將個人專用連結分享給他人。</p><a href="https://line.me/R/oaMessage/%40408xeydj/?%E6%88%91%E8%A6%81%E9%A0%90%E7%B4%84">回官方 LINE 重新預約</a></main><div class="warning">禁止酒駕・飲酒過量，有害健康<br>未滿十八歲禁止飲酒</div><script>
'use strict';
const params=new URLSearchParams(location.hash.slice(1)),date=params.get('date')||'',time=params.get('time')||'',token=params.get('token')||'';
const $=id=>document.getElementById(id);let payload='';
const goodDate=/^\d{4}-\d{2}-\d{2}$/.test(date)&&!isNaN(new Date(date+'T12:00:00+08:00'));
const goodTime=/^(10|11|12|13|14|15|16):00~(11|12|13|14|15|16|17):00$/.test(time)&&Number(time.slice(6,8))===Number(time.slice(0,2))+1;
if(!goodDate||!goodTime||!/^[a-f0-9]{32}$/.test(token)){$('summary').hidden=true;$('error').hidden=false;$('error').textContent='請先回官方 LINE 點選「預約品飲」，選好日期與時間，再開啟個人資料表單。';}else{$('summary').textContent='品飲日期：'+date+'\n品飲時間：'+time;$('summary').style.whiteSpace='pre-line';$('details').hidden=false;}
$('details').addEventListener('submit',e=>{e.preventDefault();const name=$('name').value.trim(),phone=$('phone').value.trim(),people=$('people').value,note=$('note').value.trim();if(!/^[\u4e00-\u9fa5A-Za-z\s.\-]{2,50}$/.test(name)||/[\r\n]/.test(name)){$('name').setCustomValidity('請填寫 2～50 字中文或英文姓名，不含數字。');$('name').reportValidity();return;}$('name').setCustomValidity('');if(!/^09\d{8}$/.test(phone)||!/^([1-9]|10)$/.test(people))return;if(note.length>500)return;payload='預約資料\n姓名：'+name+'\n電話：'+phone+'\n人數：'+people+'\n備註：'+(note||'無')+'\n驗證碼：'+token;$('review').textContent='日期：'+date+'\n時間：'+time+'\n姓名：'+name+'\n電話：'+phone+'\n人數：'+people+'\n備註：'+(note||'無');$('returnLine').href='https://line.me/R/oaMessage/%40408xeydj/?'+encodeURIComponent(payload);$('details').hidden=true;$('confirm').hidden=false;});$('name').addEventListener('input',()=>{$('name').setCustomValidity('');});$('edit').addEventListener('click',()=>{$('confirm').hidden=true;$('details').hidden=false;});
</script></body></html>
