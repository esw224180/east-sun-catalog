<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>東太陽製酒｜商品資訊</title>
<style>*{box-sizing:border-box}body{margin:0;padding-bottom:calc(10vh + 16px);background:#f6f3eb;color:#163c32;font:17px system-ui}header{background:#153e32;color:#fff;padding:32px 6vw}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:30px}input{width:100%;padding:14px;font:inherit;border:1px solid #8a9e92;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}article{background:#fff;padding:20px;border-radius:14px}img{width:100%;height:220px;object-fit:contain}h2{font-size:20px}a{display:inline-block;color:#fff;background:#19553f;padding:12px;border-radius:7px}.photo-link{display:block;background:transparent;padding:0;border-radius:0}.photo-link:focus-visible{outline:3px solid #c1a052}footer{position:fixed;bottom:0;left:0;width:100%;min-height:10vh;display:flex;align-items:center;justify-content:center;font-weight:700;z-index:5;background:#153e32;color:#fff;padding:18px;text-align:center}.notice{line-height:1.8}#state{min-height:32px}</style></head>
<body><header>東太陽製酒<h1>認識每一款風土酒香</h1><p>商品資訊・客服洽詢</p><a href="https://line.me/R/ti/p/%40esw224180" target="_blank" rel="noopener noreferrer">聯絡客服</a></header><main><p class="notice">本頁僅提供商品資訊與客服洽詢。交易請由人員於現場辨識年齡並確認；本頁不接受訂購或付款。</p><input id="search" aria-label="搜尋品名或條碼" placeholder="搜尋品名、系列或條碼" disabled><p id="state" role="status">正在準備目錄…</p><p id="lineState" role="status"></p><section id="grid" class="grid"></section></main><footer>禁止酒駕・飲酒過量，有害健康・未滿18歲禁止飲酒</footer>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
// 設定後將本檔部署在穩定 HTTPS 網址；不將 GAS HTML iframe 作為 LIFF 頁面。
const CONFIG={appsScriptUrl:'https://script.google.com/macros/s/AKfycbxb_0VqBQ3gLmTzYKt9yGrzS0tVPhZTf6Sh7WxYEAROqKgB_yG0T5uj80RqlJEIvq6soQ/exec',liffId:'2012112469-Vj7DFE9w',officialAccount:'@esw224180'};
let products=[];
const state=document.getElementById('state');
const search=document.getElementById('search');
let catalogTimer;
function httpsUrl(value){try{const u=new URL(value);return u.protocol==='https:'&&!u.username&&!u.password?u:null}catch(e){return null}}
function render(){
  const q=search.value.trim().toLowerCase();
  const found=products.filter(p=>(p.name+' '+p.barcode+' '+p.category).toLowerCase().includes(q));
  const grid=document.getElementById('grid');grid.replaceChildren();
  state.textContent=products.length===0?'目前尚無審核通過的公開商品，歡迎聯絡客服了解商品資訊。':q&&found.length===0?'找不到符合的商品。':'共 '+found.length+' 項商品';
  for(const p of found){
    const card=document.createElement('article');
    if(p.image&&httpsUrl(p.image)){
      const image=document.createElement('img');image.src=p.image;image.alt=p.name;image.loading='lazy';image.referrerPolicy='no-referrer';
      image.onerror=()=>{image.remove();const msg=document.createElement('p');msg.textContent='圖片暫無法顯示';card.prepend(msg)};const photoLink=document.createElement('a');photoLink.href=p.image;photoLink.target='_blank';photoLink.rel='noopener';photoLink.className='photo-link';photoLink.setAttribute('aria-label',p.name+'，開啟清晰大圖');photoLink.title='點圖查看清晰大圖';photoLink.append(image);card.append(photoLink);
    }
    const title=document.createElement('h2');title.textContent=p.name;
    const spec=document.createElement('p');spec.textContent=[p.category,p.volume,p.abv].filter(Boolean).join(' · ');
    const barcode=document.createElement('p');barcode.textContent='條碼：'+p.barcode;
    const a=document.createElement('a');a.textContent='聯絡客服';a.href='https://line.me/R/ti/p/'+encodeURIComponent(CONFIG.officialAccount);a.target='_blank';a.rel='noopener noreferrer';
    card.append(title,spec,barcode,a);grid.append(card);
  }
}
window.publicCatalog=data=>{
  clearTimeout(catalogTimer);
  if(!data||!data.ok||!Array.isArray(data.products)){state.textContent='目錄尚未準備完成，請聯絡客服。';return}
  products=data.products;search.disabled=false;render();
};
search.addEventListener('input',render);
const sourceUrl=httpsUrl(CONFIG.appsScriptUrl);
if(sourceUrl&&sourceUrl.hostname==='script.google.com'&&sourceUrl.pathname.startsWith('/macros/s/')&&sourceUrl.pathname.endsWith('/exec')){
  state.textContent='正在載入目錄…';
  catalogTimer=setTimeout(()=>{state.textContent='目錄載入逾時，請重新整理或聯絡客服。'},15000);
  const script=document.createElement('script');script.src=sourceUrl.href;
  script.onerror=()=>{clearTimeout(catalogTimer);state.textContent='目錄載入失敗，請稍後重試或聯絡客服'};
  document.head.append(script);
}else state.textContent='目錄來源尚未完成設定，請聯絡客服。';
if(CONFIG.liffId){
  const lineState=document.getElementById('lineState');
  if(window.liff)liff.init({liffId:CONFIG.liffId}).catch(()=>{lineState.textContent='LINE 初始化失敗，仍可瀏覽商品資訊。'});
  else lineState.textContent='LINE 元件未載入，仍可瀏覽商品資訊。';
}
</script></body></html>
